<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>크리스마스 영어 탐험 퀴즈</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;color:#fff;background:linear-gradient(180deg,#0a1a38 0%,#12305a 55%,#1b4a6e 100%);min-height:100vh;overflow-x:hidden}
[hidden]{display:none!important}
#snow{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.flake{position:absolute;top:-30px;color:#fff;opacity:.8;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(115vh) translateX(var(--dx,0px))}}
main{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:14px}
.screen{display:none}
.screen.active{display:block}
.panel{max-width:700px;margin:0 auto;background:rgba(255,255,255,.1);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.25);border-radius:22px;padding:22px}
h1{margin:4px 0 4px;text-align:center;font-size:clamp(24px,6vw,36px);font-weight:400;text-shadow:0 3px 10px rgba(0,0,0,.4)}
.sub{text-align:center;margin:0 0 18px;color:#ffe9a8;font-size:17px}
label.lb{display:block;margin:14px 0 6px;font-size:18px;color:#ffd24a}
#name{width:100%;padding:12px 16px;font:inherit;font-size:20px;border-radius:14px;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.95);color:#222}
#name:focus{outline:3px solid #ffd24a}
#chars{display:flex;gap:12px}
.char{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 6px 10px;border-radius:16px;border:2px solid transparent;background:rgba(255,255,255,.13);color:#fff;font:inherit;font-size:18px;cursor:pointer;transition:transform .12s,background .12s}
.char:hover{transform:translateY(-2px);background:rgba(255,255,255,.2)}
.char.sel{border-color:#ffd24a;background:rgba(255,210,74,.22)}
.char canvas{width:72px;height:96px}
#units{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.unit{position:relative;display:flex;align-items:center;gap:10px;text-align:left;padding:12px;border-radius:16px;border:2px solid transparent;background:rgba(255,255,255,.13);color:#fff;font:inherit;cursor:pointer;transition:transform .12s,background .12s}
.unit:hover{transform:translateY(-2px);background:rgba(255,255,255,.2)}
.unit.sel{border-color:#ffd24a;background:rgba(255,210,74,.22)}
.ue{font-size:30px}
.ut b{display:block;font-weight:400;font-size:17px;line-height:1.25}
.ut small{display:block;font-size:12px;color:#cfe3ff;margin-top:2px}
.ub{position:absolute;right:8px;top:6px;font-size:12px;background:#ffd24a;color:#5a3b00;border-radius:999px;padding:1px 8px}
.msg{min-height:26px;margin:12px 0 0;text-align:center;color:#ffd24a;font-size:17px}
.btn{display:inline-block;padding:13px 26px;border:0;border-radius:999px;background:#e53935;color:#fff;font:inherit;font-size:19px;cursor:pointer;box-shadow:0 4px 0 #a4201e;transition:transform .1s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a4201e}
.btn.ghost{background:#3d5d8c;box-shadow:0 4px 0 #26406a}
.center{text-align:center}
.total{text-align:center;margin:14px 0 0;color:#cfe3ff;font-size:16px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.back{padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff;font:inherit;font-size:15px;cursor:pointer}
.utitle{font-size:clamp(17px,4.5vw,24px);text-align:center;flex:1}
.pills{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.pill{background:rgba(255,255,255,.15);border-radius:999px;padding:5px 14px;font-size:16px}
.pill.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.25);background:#ffd24a;color:#5a3b00}}
.tip{text-align:center;color:#cfe3ff;font-size:15px;margin:6px 0 0}
.stage{position:relative;margin:8px auto 0;width:min(100%,860px,calc((100vh - 230px)*4/3));min-width:300px}
.stage canvas{display:block;width:100%;height:auto;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.45);touch-action:none;background:#000;cursor:pointer}
.dpad{position:absolute;right:10px;bottom:10px;display:grid;grid-template-columns:repeat(3,50px);grid-template-rows:repeat(3,50px);gap:4px;opacity:.85}
.dpad button{border:2px solid rgba(255,255,255,.7);border-radius:50%;background:rgba(20,30,60,.55);color:#fff;font-size:22px;touch-action:none;cursor:pointer;-webkit-user-select:none;user-select:none}
.dpad button:active{background:rgba(255,210,74,.6)}
.dpad .u{grid-column:2;grid-row:1}
.dpad .l{grid-column:1;grid-row:2}
.dpad .r{grid-column:3;grid-row:2}
.dpad .d{grid-column:2;grid-row:3}
@media (hover:hover) and (pointer:fine){.dpad{display:none}}
.overlay{position:fixed;inset:0;background:rgba(5,12,30,.72);display:flex;align-items:center;justify-content:center;padding:14px;z-index:10}
.card{position:relative;background:#fffaf0;color:#2b2b2b;border-radius:22px;max-width:520px;width:100%;padding:22px;max-height:92vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.5);animation:pop .25s}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.x{position:absolute;right:12px;top:10px;border:0;background:#eee;border-radius:50%;width:34px;height:34px;font-size:16px;cursor:pointer;color:#555}
.mhead{color:#c62828;font-size:16px;margin-right:36px}
.k{margin:10px 0 0;color:#6a5a3a;font-size:16px}
.q{margin:6px 0 10px;font-size:clamp(22px,5.5vw,28px);font-weight:400;line-height:1.35;color:#1b2b4a}
.blank{display:inline-block;min-width:60px;border-bottom:3px solid #e53935;margin:0 4px;color:transparent}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;border-radius:14px;border:2px solid #e0d6c2;background:#fff;font:inherit;font-size:19px;color:#2b2b2b;cursor:pointer;transition:border-color .1s,transform .1s}
.opt:hover:not(:disabled){border-color:#e53935;transform:translateX(3px)}
.opt:disabled{cursor:default}
.opt.correct{background:#d8f5e0;border-color:#2e9e57}
.opt.wrong{background:#fde0e0;border-color:#d93a3a}
.fb{margin-top:10px;padding:10px 14px;border-radius:12px;font-size:17px;line-height:1.55}
.fb b{display:block;font-weight:400;font-size:20px}
.fb.ok{background:#e4f8ea;color:#1e6b3a}
.fb.no{background:#fdeaea;color:#a02828}
#next{margin-top:14px;width:100%}
.big{font-size:64px;line-height:1}
.card.center h2{margin:8px 0 0;font-weight:400;font-size:28px;color:#c62828}
.score{margin:4px 0;font-size:56px;color:#1b2b4a}
.score small{font-size:24px;color:#777}
.tot{color:#555;font-size:16px;margin:6px 0 16px}
.btns{display:flex;flex-direction:column;gap:10px}
.conf{position:fixed;top:-30px;z-index:20;pointer-events:none;animation:fall linear forwards}
@media(max-width:480px){#units{grid-template-columns:1fr}.panel{padding:16px}}
</style>
</head>
<body>
<div id="snow"></div>
<main>
  <!-- 시작 화면 -->
  <section id="screen-start" class="screen active">
    <div class="panel">
      <h1>🎄 크리스마스 영어 탐험 🎁</h1>
      <p class="sub">초등학교 5학년 영어 복습 · 집 안을 돌아다니며 선물을 찾아요!</p>
      <label class="lb" for="name">✏️ 이름을 써 주세요</label>
      <input id="name" type="text" maxlength="10" placeholder="이름" autocomplete="off">
      <label class="lb">🧑 캐릭터를 골라 주세요</label>
      <div id="chars">
        <button class="char" type="button" data-g="boy"><canvas width="90" height="120" data-g="boy"></canvas><span>👦 남자아이</span></button>
        <button class="char" type="button" data-g="girl"><canvas width="90" height="120" data-g="girl"></canvas><span>👧 여자아이</span></button>
      </div>
      <label class="lb">📚 단원을 골라 주세요</label>
      <div id="units"></div>
      <p class="msg" id="msg"></p>
      <div class="center"><button class="btn" id="go" type="button">집으로 들어가기 🏠</button></div>
      <p class="total" id="total"></p>
    </div>
  </section>

  <!-- 게임 화면 -->
  <section id="screen-game" class="screen">
    <div class="bar">
      <button class="back" id="back" type="button">← 단원 선택</button>
      <div class="utitle" id="utitle"></div>
      <button class="back" id="mute" type="button" aria-label="소리 켜기/끄기">🔊</button>
    </div>
    <div class="pills">
      <span class="pill" id="pname"></span>
      <span class="pill" id="pscore"></span>
      <span class="pill" id="pprog"></span>
    </div>
    <p class="tip">⌨️ 방향키 · WASD로 걷거나 화면을 눌러 이동해요. 🎁 선물에 가까이 가면 퀴즈가 나와요!</p>
    <div class="stage">
      <canvas id="cv" aria-label="크리스마스 트리가 있는 거실"></canvas>
      <div class="dpad">
        <button class="u" data-k="up" type="button" aria-label="위">▲</button>
        <button class="l" data-k="left" type="button" aria-label="왼쪽">◀</button>
        <button class="r" data-k="right" type="button" aria-label="오른쪽">▶</button>
        <button class="d" data-k="down" type="button" aria-label="아래">▼</button>
      </div>
    </div>
  </section>
</main>

<!-- 문제 창 -->
<div id="modal" class="overlay" hidden role="dialog" aria-modal="true">
  <div class="card">
    <button class="x" id="mclose" type="button" aria-label="닫기">✕</button>
    <div class="mhead" id="mhead"></div>
    <p class="k" id="mk"></p>
    <h2 class="q" id="mq"></h2>
    <div id="opts"></div>
    <div class="fb" id="fb" hidden><b id="fbh"></b><span id="fbe"></span></div>
    <button class="btn" id="next" type="button" hidden>확인 ▶</button>
  </div>
</div>

<!-- 결과 창 -->
<div id="result" class="overlay" hidden>
  <div class="card center">
    <div class="big" id="rEmoji">🎉</div>
    <h2 id="rTitle"></h2>
    <p class="score"><span id="rScore">0</span><small> / 10</small></p>
    <p id="rMsg"></p>
    <p class="tot" id="rTot"></p>
    <div class="btns">
      <button class="btn" id="rNext" type="button">다음 단원으로 ▶</button>
      <button class="btn ghost" id="rPick" type="button">단원 선택하기</button>
      <button class="btn ghost" id="rRetry" type="button">이 단원 다시 풀기</button>
    </div>
  </div>
</div>

<!-- 문제 데이터: 문제를 고치거나 추가하려면 아래 UNITS만 수정하세요.
     o 배열의 첫 번째 보기가 정답이에요(화면에서는 자동으로 섞여요). -->
<script>
const UNITS = [
  {
    id: "u1", emoji: "👋", title: "자기소개와 인사", sub: "Greetings and Introductions",
    qs: [
      { k: "알맞은 대답을 고르세요.", q: "What's your name?", o: ["My name is Mina.", "I'm from Korea.", "I'm ten years old.", "I like pizza."], e: "이름을 물었으니 “My name is ~.”로 답해요." },
      { k: "알맞은 대답을 고르세요.", q: "Where are you from?", o: ["I'm from Korea.", "I'm eleven.", "I'm fine.", "My name is Tom."], e: "어느 나라에서 왔는지 묻는 말이에요. “I'm from ~.”으로 답해요." },
      { k: "알맞은 대답을 고르세요.", q: "Nice to meet you.", o: ["Nice to meet you, too.", "Goodbye.", "You're welcome.", "I'm sorry."], e: "처음 만났을 때 인사에는 “Nice to meet you, too.”라고 답해요." },
      { k: "알맞은 대답을 고르세요.", q: "How are you?", o: ["I'm fine, thank you.", "My name is Tom.", "I'm from Canada.", "It's Monday."], e: "안부를 물었으니 “I'm fine, thank you.”로 답해요." },
      { k: "알맞은 대답을 고르세요.", q: "How old are you?", o: ["I'm eleven years old.", "I'm from Japan.", "I'm a teacher.", "It's 11 o'clock."], e: "나이를 물을 때는 “I'm ~ years old.”로 답해요." },
      { k: "빈칸에 알맞은 말을 고르세요.", q: "He ___ from Canada.", o: ["is", "am", "are", "do"], e: "주어가 He일 때는 be동사 is를 써요." },
      { k: "빈칸에 알맞은 말을 고르세요.", q: "Jiho is a boy. ___ is my friend.", o: ["He", "She", "It", "They"], e: "남자 한 명은 He로 나타내요." },
      { k: "빈칸에 알맞은 말을 고르세요.", q: "I ___ a student.", o: ["am", "is", "are", "be"], e: "주어가 I일 때는 am을 써요." },
      { k: "영어로 바르게 쓴 것을 고르세요.", q: "“캐나다에서 왔어요.”", o: ["I'm from Canada.", "I from Canada.", "I'm to Canada.", "I'm at Canada."], e: "“I'm from ~.”은 어디에서 왔는지 말할 때 써요." },
      { k: "알맞은 대답을 고르세요.", q: "Are you a student? — Yes, ___.", o: ["I am", "I do", "I'm", "I is"], e: "Are you ~?에는 Yes, I am.으로 답해요." }
    ]
  },
  {
    id: "u2", emoji: "🎨", title: "취미와 능력", sub: "Hobbies and Abilities",
    qs: [
      { k: "알맞은 대답을 고르세요.", q: "What do you do in your free time?", o: ["I play the guitar.", "I'm fine.", "It's Monday.", "I'm from Korea."], e: "여가 시간에 하는 일을 묻는 말이에요. 하는 활동으로 답해요." },
      { k: "알맞은 대답을 고르세요.", q: "Can you swim? — Yes, ___.", o: ["I can", "I do", "I am", "it is"], e: "Can you ~?에는 Yes, I can. / No, I can't.로 답해요." },
      { k: "빈칸에 알맞은 말을 고르세요.", q: "I ___ play soccer very well. (축구를 아주 잘할 수 있어요)", o: ["can", "am", "is", "does"], e: "“~할 수 있다”는 can으로 나타내요." },
      { k: "빈칸에 알맞은 말을 고르세요.", q: "She can ___ the piano.", o: ["play", "plays", "playing", "played"], e: "can 뒤에는 동사원형을 써요." },
      { k: "우리말 뜻을 고르세요.", q: "I like drawing pictures.", o: ["나는 그림 그리는 것을 좋아해요.", "나는 그림을 사고 싶어요.", "나는 그림을 보고 있어요.", "나는 그림을 잘 못 그려요."], e: "like ~ing는 “~하는 것을 좋아하다”라는 뜻이에요." },
      { k: "알맞은 대답을 고르세요.", q: "Can you play badminton? — No, I ___.", o: ["can't", "don't", "isn't", "am not"], e: "Can you ~?에 “아니요”라고 답할 땐 No, I can't.예요." },
      { k: "빈칸에 알맞은 말을 고르세요.", q: "My hobby is ___ books.", o: ["reading", "read", "reads", "reader"], e: "My hobby is 뒤에는 ~ing 형태를 써요. 독서하기 = reading." },
      { k: "뜻이 알맞은 것을 고르세요.", q: "cooking", o: ["요리하기", "수영하기", "노래하기", "춤추기"], e: "cooking은 “요리하기”예요. cook(요리하다) + ing." },
      { k: "알맞은 대답을 고르세요.", q: "What's your hobby?", o: ["My hobby is taking pictures.", "Yes, I can.", "I'm ten.", "It's sunny."], e: "취미를 물었으니 “My hobby is ~.”로 답해요." },
      { k: "알맞은 대답을 고르세요.", q: "Can he play the violin? — Yes, he ___.", o: ["can", "does", "is", "has"], e: "Can he ~?에는 Yes, he can.으로 답해요." }
    ]
  },
  {
    id: "u3", emoji: "📅", title: "날짜와 요일", sub: "Days and Dates",
    qs: [
      { k: "알맞은 대답을 고르세요.", q: "What day is it today?", o: ["It's Friday.", "It's 3 o'clock.", "It's sunny.", "It's five dollars."], e: "“What day ~?”는 요일을 묻는 말이에요." },
      { k: "알맞은 대답을 고르세요.", q: "When is your birthday?", o: ["It's May 5th.", "I'm eleven years old.", "It's five o'clock.", "I like cake."], e: "“When ~?”은 언제인지 묻는 말이라 날짜로 답해요." },
      { k: "알맞은 말을 고르세요.", q: "May 1st → May ___", o: ["first", "one", "oneth", "once"], e: "1일은 first, 2일은 second, 3일은 third… 로 읽어요." },
      { k: "빈칸에 알맞은 말을 고르세요.", q: "March is the ___ month of the year.", o: ["third", "three", "second", "fourth"], e: "3월은 한 해의 세 번째 달이므로 third예요." },
      { k: "빈칸에 알맞은 말을 고르세요.", q: "Monday, Tuesday, ___, Thursday", o: ["Wednesday", "Friday", "Saturday", "Sunday"], e: "월-화-수-목 순서라서 Wednesday(수요일)예요." },
      { k: "알맞은 말을 고르세요.", q: "October 9th → October ___", o: ["ninth", "nine", "nineth", "ninety"], e: "9번째(9일)는 ninth로 써요. (nineth는 틀린 철자예요)" },
      { k: "빈칸에 알맞은 말을 고르세요.", q: "I have English class ___ Monday.", o: ["on", "in", "at", "to"], e: "요일 앞에는 on을 써요." },
      { k: "빈칸에 알맞은 말을 고르세요.", q: "My birthday is ___ December.", o: ["in", "on", "at", "of"], e: "월 이름 앞에는 in을 써요." },
      { k: "영어로 알맞은 것을 고르세요.", q: "“8월”", o: ["August", "April", "July", "June"], e: "8월은 August예요." },
      { k: "빈칸에 알맞은 말을 고르세요.", q: "Children's Day is on May ___.", o: ["fifth", "five", "fiveth", "fifty"], e: "5일은 서수 fifth로 써요." }
    ]
  },
  {
    id: "u4", emoji: "⏰", title: "시각과 하루 일과", sub: "Time and Daily Routine",
    qs: [
      { k: "3시 30분이에요. 알맞은 대답은?", q: "What time is it?", o: ["It's three thirty.", "It's Tuesday.", "It's May 3rd.", "It's sunny."], e: "시각을 물으면 “It's + 시 + 분.”으로 답해요." },
      { k: "알맞은 대답을 고르세요.", q: "What time do you get up?", o: ["I get up at seven.", "I get up on Monday.", "I get up in Seoul.", "I'm fine."], e: "시각 앞에는 at을 써요." },
      { k: "빈칸에 알맞은 말을 고르세요.", q: "I ___ breakfast at 7:30.", o: ["have", "has", "am", "do"], e: "아침을 먹다 = have breakfast. 주어가 I이므로 have를 써요." },
      { k: "빈칸에 알맞은 말을 고르세요.", q: "He ___ to school at eight.", o: ["goes", "go", "going", "gone"], e: "주어가 He(3인칭 단수)이면 go → goes로 써요." },
      { k: "빈칸에 알맞은 말을 고르세요.", q: "I go to bed ___ ten o'clock.", o: ["at", "on", "in", "for"], e: "시각 앞에는 at을 써요." },

function drawTree(t) {
  const cx = 400, by = 418;
  ell(c, cx, by + 2, 96, 16, "rgba(0,0,0,.25)");
  box(c, cx - 16, by - 28, 32, 30, 3, "#7a4a24");
  LAYERS.forEach(L => {
    const gr = c.createLinearGradient(0, L.ay, 0, L.by);
    gr.addColorStop(0, "#3fbf74"); gr.addColorStop(1, "#1a7d43");
    c.fillStyle = gr;
    c.beginPath(); c.moveTo(cx, L.ay); c.lineTo(cx - L.h, L.by); c.lineTo(cx + L.h, L.by); c.closePath(); c.fill();
  });
  ell(c, cx, by - 6, 66, 11, "#f4f4f4");
  TL.forEach((p, i) => {
    if (i % 3 === 0) {
      dot(c, p.x, p.y, 6, i % 2 ? "#e53935" : "#ffd24a");
      dot(c, p.x - 2, p.y - 2, 1.8, "rgba(255,255,255,.8)");
    } else {
      const a = 0.45 + 0.55 * Math.abs(Math.sin(t * 2.2 + i));
      c.globalAlpha = a; dot(c, p.x, p.y, 4, TCOLS[i % 5]); c.globalAlpha = 1;
    }
  });
  // 별
  c.save();
  c.shadowColor = "#ffd24a"; c.shadowBlur = 14 + 6 * Math.sin(t * 3);
  c.fillStyle = "#ffd24a"; c.beginPath();
  for (let k = 0; k < 10; k++) {
    const ang = (-90 + 36 * k) * Math.PI / 180, rad = k % 2 ? 9 : 20;
    const px = cx + rad * Math.cos(ang), py = 116 + rad * Math.sin(ang);
    k ? c.lineTo(px, py) : c.moveTo(px, py);
  }
  c.closePath(); c.fill(); c.restore();
}

function drawFire(t) {
  const gr = c.createRadialGradient(400, 100, 5, 400, 100, 95);
  gr.addColorStop(0, "rgba(255,160,40,.38)"); gr.addColorStop(1, "rgba(255,160,40,0)");
  c.fillStyle = gr; c.fillRect(300, 30, 200, 150);
  box(c, 372, 96, 56, 8, 3, "#5a3a1e");
  for (let k = 0; k < 5; k++) {
    const x = 378 + k * 11, h = 16 + Math.sin(t * 9 + k * 1.7) * 7 + (k === 2 ? 8 : 0);
    c.fillStyle = "#ff8a1f"; c.beginPath(); c.moveTo(x - 7, 98); c.quadraticCurveTo(x - 6, 98 - h * 0.6, x, 98 - h); c.quadraticCurveTo(x + 6, 98 - h * 0.6, x + 7, 98); c.closePath(); c.fill();
    c.fillStyle = "#ffe26a"; c.beginPath(); c.moveTo(x - 3, 98); c.quadraticCurveTo(x - 3, 98 - h * 0.4, x, 98 - h * 0.62); c.quadraticCurveTo(x + 3, 98 - h * 0.4, x + 3, 98); c.closePath(); c.fill();
  }
}

/* ===== 선물 ===== */
function drawGift(g, t) {
  const bob = g.open ? 0 : Math.sin(t * 3 + g.i * 0.8) * 3;
  const x = g.x, y = g.y + bob;
  ell(c, g.x, g.y + 2, 21, 6, "rgba(0,0,0,.25)");
  if (!g.open) {
    const pr = 0.5 + 0.5 * Math.sin(t * 3 + g.i);
    const gr = c.createRadialGradient(x, y - 20, 4, x, y - 20, 46);
    gr.addColorStop(0, "rgba(255,230,120," + (0.35 + 0.2 * pr) + ")"); gr.addColorStop(1, "rgba(255,230,120,0)");
    c.fillStyle = gr; c.beginPath(); c.arc(x, y - 20, 46, 0, Math.PI * 2); c.fill();
  }
  box(c, x - 19, y - 30, 38, 30, 3, g.c);
  c.fillStyle = g.r; c.fillRect(x - 4, y - 30, 8, 30);
  if (g.open) { c.fillStyle = "rgba(0,0,0,.35)"; c.fillRect(x - 19, y - 30, 38, 5); }
  const p = g.open ? Math.min(g.openT / 0.4, 1) : 0;
  c.save();
  c.translate(x + p * 8, y - 34 - p * 22);
  if (p) c.rotate(-0.35 * p);
  box(c, -23, -8, 46, 14, 3, g.c);
  box(c, -23, -8, 46, 14, 3, "rgba(255,255,255,.2)");
  c.fillStyle = g.r; c.fillRect(-4, -8, 8, 14);
  if (!g.open) {
    c.strokeStyle = g.r; c.lineWidth = 3;
    c.beginPath(); c.ellipse(-7, -12, 7, 5, -0.4, 0, Math.PI * 2); c.stroke();
    c.beginPath(); c.ellipse(7, -12, 7, 5, 0.4, 0, Math.PI * 2); c.stroke();
  }
  c.restore();
  dot(c, x, y - 13, 9, "#fff");
  c.fillStyle = "#333"; c.font = "13px Jua, sans-serif"; c.textAlign = "center"; c.textBaseline = "middle";
  c.fillText(String(g.i + 1), x, y - 12);
  if (g.open) {
    dot(c, x + 19, y - 40, 11, g.res ? "#2e9e57" : "#d93a3a");
    c.strokeStyle = "#fff"; c.lineWidth = 2; c.beginPath(); c.arc(x + 19, y - 40, 11, 0, Math.PI * 2); c.stroke();
    c.fillStyle = "#fff"; c.font = "15px Jua, sans-serif";
    c.fillText(g.res ? "✓" : "✗", x + 19, y - 39);
  }
}

function genGifts() {
  const out = [];
  let minD = 112, tries = 0;
  while (out.length < 10 && tries < 6000) {
    tries++;
    if (tries % 1000 === 0) minD -= 12;
    const x = 60 + Math.random() * 680, y = 165 + Math.random() * 395;
    if (x > 255 && x < 545 && y < 450) continue;
    if (Math.hypot(x - START.x, y - START.y) < 130) continue;
    if (OBST.some(o => x > o.x - 34 && x < o.x + o.w + 34 && y > o.y - 30 && y < o.y + o.h + 26)) continue;
    if (out.some(g => Math.hypot(g.x - x, g.y - y) < minD)) continue;
    out.push({ x, y });
  }
  let f = 0;
  while (out.length < 10) { out.push({ x: FALLBACK[f][0], y: FALLBACK[f][1] }); f++; }
  return out.map((p, i) => ({ x: p.x, y: p.y, i, c: GIFT_COLORS[i][0], r: GIFT_COLORS[i][1], open: false, res: null, openT: 0, near: false }));
}

/* ===== 이동 ===== */
function hits(nx, ny) {
  const bx = nx - 12, by = ny - 10, bw = 24, bh = 10;
  return OBST.some(o => bx < o.x + o.w && bx + bw > o.x && by < o.y + o.h && by + bh > o.y);
}
function tryMove(mx, my) {
  const nx = clamp(player.x + mx, BOUNDS.x1, BOUNDS.x2), ny = clamp(player.y + my, BOUNDS.y1, BOUNDS.y2);
  if (!hits(nx, ny)) { player.x = nx; player.y = ny; }
}
function modalOpen() { return !$("#modal").hidden || !$("#result").hidden; }

function update(dt) {
  gifts.forEach(g => { if (g.open) g.openT += dt; });
  fx.forEach(p => { p.t += dt; });
  fx = fx.filter(p => p.t < 1.1);
  if (modalOpen()) { moving = false; return; }
  let dx = (keys.right ? 1 : 0) - (keys.left ? 1 : 0), dy = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
  if (dx || dy) target = null;
  else if (target) {
    const vx = target.x - player.x, vy = target.y - player.y, d = Math.hypot(vx, vy);
    if (d < 5) target = null; else { dx = vx / d; dy = vy / d; }
  }
  const len = Math.hypot(dx, dy);
  moving = len > 0;
  if (moving) {
    dx /= len; dy /= len;
    if (Math.abs(dx) > Math.abs(dy)) player.face = dx < 0 ? "left" : "right";
    else player.face = dy < 0 ? "up" : "down";
    const sp = 215 * dt, bx = player.x, by = player.y;
    tryMove(dx * sp, 0); tryMove(0, dy * sp);
    if (target && Math.hypot(player.x - bx, player.y - by) < sp * 0.25) { target = null; moving = false; }
  }
  gifts.forEach(g => {
    const near = !g.open && Math.hypot(player.x - g.x, player.y - g.y) < 40;
    if (near && !g.near && !modalOpen()) openQ(g.i);
    g.near = near;
  });
}

/* ===== 그리기 ===== */
function draw(t) {
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, W, H);
  c.drawImage(bg, 0, 0, W, H);
  drawFire(t);
  if (target) {
    const r = 8 + 3 * Math.sin(t * 8);
    c.strokeStyle = "rgba(255,255,255,.85)"; c.lineWidth = 2.5;
    c.beginPath(); c.ellipse(target.x, target.y, r, r * 0.5, 0, 0, Math.PI * 2); c.stroke();
  }
  const items = [
    { y: 152, f: drawShelf }, { y: 168, f: drawTable }, { y: 420, f: () => drawTree(t) },
    { y: 530, f: drawSofa }, { y: 536, f: drawChair },
    { y: player.y, f: () => drawPlayer(c, player.x, player.y, state.gender || "boy", t, moving, player.face) }
  ];
  gifts.forEach(g => items.push({ y: g.y, f: () => drawGift(g, t) }));
  items.sort((a, b) => a.y - b.y).forEach(it => it.f());
  fx.forEach(p => {
    c.globalAlpha = Math.max(0, 1 - p.t / 1.1);
    c.font = "34px Jua, sans-serif"; c.textAlign = "center"; c.textBaseline = "middle";
    c.lineWidth = 5; c.strokeStyle = "rgba(0,0,0,.6)";
    const yy = p.y - p.t * 55;
    c.strokeText(p.txt, p.x, yy);
    c.fillStyle = p.col; c.fillText(p.txt, p.x, yy);
    c.globalAlpha = 1;
  });
}

let last = 0, running = false;
function loop(ts) {
  if (!running) return;
  const dt = Math.min((ts - last) / 1000, 0.05);
  last = ts;
  update(dt);
  draw(ts / 1000);
  requestAnimationFrame(loop);
}
function startLoop() { if (running) return; running = true; last = performance.now(); requestAnimationFrame(loop); }
function stopLoop() { running = false; }

/* ===== 조작 ===== */
const KEYMAP = { ArrowLeft: "left", a: "left", A: "left", ArrowRight: "right", d: "right", D: "right", ArrowUp: "up", w: "up", W: "up", ArrowDown: "down", s: "down", S: "down" };
window.addEventListener("keydown", e => {
  const k = KEYMAP[e.key];
  if (!k || !running || modalOpen() || (e.target && e.target.tagName === "INPUT")) return;
  keys[k] = true;
  e.preventDefault();
});
window.addEventListener("keyup", e => { const k = KEYMAP[e.key]; if (k) keys[k] = false; });
window.addEventListener("blur", () => { Object.keys(keys).forEach(k => keys[k] = false); });

let pressing = false;
function setTarget(e) {
  const r = cv.getBoundingClientRect();
  target = {
    x: clamp((e.clientX - r.left) * W / r.width, BOUNDS.x1, BOUNDS.x2),
    y: clamp((e.clientY - r.top) * H / r.height, BOUNDS.y1, BOUNDS.y2)
  };
}
cv.addEventListener("pointerdown", e => { if (modalOpen()) return; pressing = true; setTarget(e); });
cv.addEventListener("pointermove", e => { if (pressing && !modalOpen()) setTarget(e); });
window.addEventListener("pointerup", () => { pressing = false; });
document.querySelectorAll(".dpad button").forEach(b => {
  const k = b.dataset.k;
  b.addEventListener("pointerdown", e => { e.preventDefault(); keys[k] = true; });
  ["pointerup", "pointerleave", "pointercancel"].forEach(ev => b.addEventListener(ev, () => { keys[k] = false; }));
});

/* ===== 화면 전환 / 시작 화면 ===== */
function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("active", s.id === id));
  window.scrollTo(0, 0);
}
function msg(t) { $("#msg").textContent = t; }

function updateTotal() {
  const ids = Object.keys(state.scores);
  const sum = ids.reduce((a, k) => a + state.scores[k], 0);
  $("#total").textContent = ids.length ? "🏅 누적 점수 " + sum + "점 · 완료한 단원 " + ids.length + "/" + UNITS.length : "";
}

function renderUnits() {
  const grid = $("#units");
  grid.innerHTML = "";
  UNITS.forEach((u, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "unit" + (state.unitId === u.id ? " sel" : "");
    const sc = state.scores[u.id];
    b.innerHTML = '<span class="ue">' + u.emoji + '</span><span class="ut"><b>' + (i + 1) + ". " + u.title + "</b><small>" + u.sub + "</small></span>" + (sc !== undefined ? '<span class="ub">⭐ ' + sc + "/10</span>" : "");
    b.addEventListener("click", () => { state.unitId = u.id; msg(""); renderUnits(); });
    grid.appendChild(b);
  });
  updateTotal();
}

function renderChars() {
  document.querySelectorAll(".char").forEach(b => b.classList.toggle("sel", b.dataset.g === state.gender));
}
document.querySelectorAll(".char").forEach(b => {
  b.addEventListener("click", () => { state.gender = b.dataset.g; msg(""); renderChars(); });
});
document.querySelectorAll(".char canvas").forEach(cc => {
  const g = cc.getContext("2d");
  drawPlayer(g, cc.width / 2, cc.height - 14, cc.dataset.g, 0, false, "down");
});

$("#go").addEventListener("click", () => {
  const n = $("#name").value.trim();
  if (!n) { msg("이름을 먼저 써 주세요! ✏️"); $("#name").focus(); return; }
  if (!state.gender) { msg("캐릭터(남자아이/여자아이)를 골라 주세요! 🧑"); return; }
  if (!state.unitId) { msg("공부할 단원을 골라 주세요! 📚"); return; }
  state.name = n;
  startUnit(state.unitId);
});
$("#name").addEventListener("keydown", e => { if (e.key === "Enter") $("#go").click(); });

/* ===== 단원 시작 ===== */
function hud() {
  $("#pname").textContent = (state.gender === "girl" ? "👧 " : "👦 ") + state.name;
  $("#pscore").textContent = "⭐ " + state.score + " / 10";
  $("#pprog").textContent = "🎁 " + state.done + " / 10";
}

function startUnit(id) {
  const u = UNITS.find(x => x.id === id);
  state.unitId = id;
  state.qs = shuffle(u.qs).map(q => ({
    k: q.k || "", q: q.q, e: q.e,
    opts: shuffle(q.o.map((t, i) => ({ t: t, ok: i === 0 }))),
    res: null
  }));
  state.score = 0; state.done = 0; state.cur = -1; state.answered = false;
  gifts = genGifts();
  fx = [];
  player.x = START.x; player.y = START.y; player.face = "up";
  target = null; moving = false;
  Object.keys(keys).forEach(k => keys[k] = false);
  $("#utitle").textContent = u.emoji + " " + u.title;
  hud();
  show("screen-game");
  startLoop();
}

$("#back").addEventListener("click", () => { stopLoop(); renderUnits(); show("screen-start"); });

/* ===== 문제 창 ===== */
function renderQ(el, text) {
  el.textContent = "";
  const parts = text.split("___");
  parts.forEach((p, i) => {
    el.append(p);
    if (i < parts.length - 1) {
      const s = document.createElement("span");
      s.className = "blank";
      s.textContent = "____";
      el.append(s);
    }
  });
}

function openQ(i) {
  const q = state.qs[i];
  if (!q || q.res !== null) return;
  Object.keys(keys).forEach(k => keys[k] = false);
  target = null;
  state.cur = i;
  state.answered = false;
  $("#mhead").textContent = "🎁 " + (i + 1) + "번 선물을 찾았어요! · 문제 " + (state.done + 1) + " / 10";
  $("#mk").textContent = q.k;
  $("#mk").hidden = !q.k;
  renderQ($("#mq"), q.q);
  const bx = $("#opts");
  bx.innerHTML = "";
  q.opts.forEach((o, idx) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "opt";
    b.textContent = "①②③④"[idx] + "  " + o.t;
    b.addEventListener("click", () => answer(idx));
    bx.appendChild(b);
  });
  $("#fb").hidden = true;
  $("#next").hidden = true;
  $("#modal").hidden = false;
  tone([[880, 0.1], [1175, 0.15]]);
}

function answer(idx) {
  if (state.answered) return;
  state.answered = true;
  const q = state.qs[state.cur];
  const ok = q.opts[idx].ok;
  q.res = ok;
  state.done++;
  if (ok) state.score++;
  document.querySelectorAll("#opts .opt").forEach((b, i) => {
    b.disabled = true;
    if (q.opts[i].ok) b.classList.add("correct");
    else if (i === idx) b.classList.add("wrong");
  });
  const fb = $("#fb");
  fb.hidden = false;
  fb.className = "fb " + (ok ? "ok" : "no");
  $("#fbh").textContent = ok ? "정답이에요! 🎉 +1점" : "아쉬워요! 정답은 “" + q.opts.find(o => o.ok).t + "” 예요.";
  $("#fbe").textContent = q.e;
  hud();
  if (ok) tone([[660, 0.12], [880, 0.2]]); else tone([[260, 0.25]]);
  $("#next").hidden = false;
  $("#next").focus();
}

function closeModal() {
  if ($("#modal").hidden) return;
  $("#modal").hidden = true;
  if (state.answered) {
    const q = state.qs[state.cur];
    const g = gifts[state.cur];
    g.open = true; g.res = q.res; g.openT = 0;
    fx.push({ x: g.x, y: g.y - 50, t: 0, txt: q.res ? "+1" : "…", col: q.res ? "#ffd24a" : "#cfd8ea" });
    if (q.res) {
      const ps = $("#pscore");
      ps.classList.remove("bump");
      void ps.offsetWidth;
      ps.classList.add("bump");
    }
    state.answered = false;
    if (state.done >= 10) setTimeout(showResult, 1200);
  }
}
$("#next").addEventListener("click", closeModal);
$("#mclose").addEventListener("click", closeModal);
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
document.addEventListener("keydown", e => {
  if ($("#modal").hidden) return;
  if (e.key === "Escape") closeModal();
  if (!state.answered && "1234".includes(e.key) && e.key.length === 1) {
    const b = document.querySelectorAll("#opts .opt")[Number(e.key) - 1];
    if (b) b.click();
  }
});

/* ===== 결과 ===== */
function confetti() {
  const em = ["🎉", "⭐", "✨", "🎁", "❄️", "🎄"];
  for (let i = 0; i < 50; i++) {
    const s = document.createElement("span");
    s.className = "conf";
    s.textContent = em[Math.floor(Math.random() * em.length)];
    s.style.left = Math.random() * 100 + "%";
    s.style.fontSize = (16 + Math.random() * 18) + "px";
    s.style.animationDuration = (2.5 + Math.random() * 2.5) + "s";
    s.style.animationDelay = (Math.random() * 0.8) + "s";
    s.style.setProperty("--dx", (Math.random() * 120 - 60) + "px");
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 6500);
  }
}

function nextUnitId() {
  const idx = UNITS.findIndex(u => u.id === state.unitId);
  for (let k = 1; k <= UNITS.length; k++) {
    const u = UNITS[(idx + k) % UNITS.length];
    if (state.scores[u.id] === undefined) return u.id;
  }
  return null;
}

function showResult() {
  const sc = state.score;
  state.scores[state.unitId] = sc;
  let emo, title, text;
  if (sc === 10) { emo = "🏆"; title = "완벽해요!"; text = "영어 박사님이에요! 모든 문제를 맞혔어요."; }
  else if (sc >= 8) { emo = "🎉"; title = "정말 잘했어요!"; text = "조금만 더 하면 만점이에요."; }
  else if (sc >= 6) { emo = "😊"; title = "잘했어요!"; text = "틀린 문제를 다시 풀어 보면 더 좋아져요."; }
  else { emo = "💪"; title = "괜찮아요!"; text = "다시 도전하면 분명 더 잘할 수 있어요."; }
  $("#rEmoji").textContent = emo;
  $("#rTitle").textContent = state.name + ", " + title;
  $("#rScore").textContent = sc;
  $("#rMsg").textContent = text;
  const ids = Object.keys(state.scores);
  const sum = ids.reduce((a, k) => a + state.scores[k], 0);
  const nid = nextUnitId();
  $("#rTot").textContent = "누적 점수 " + sum + "점 · 완료한 단원 " + ids.length + "/" + UNITS.length + (nid ? "" : " 🎄 모든 단원을 끝냈어요!");
  const nb = $("#rNext");
  if (nid) {
    const nu = UNITS.find(u => u.id === nid);
    nb.hidden = false;
    nb.textContent = "다음 단원으로 ▶ " + nu.emoji + " " + nu.title;
  } else {
    nb.hidden = true;
  }
  $("#result").hidden = false;
  if (sc >= 7) { confetti(); tone([[523, 0.15], [659, 0.15], [784, 0.15], [1047, 0.3]]); }
  else tone([[440, 0.2], [523, 0.3]]);
}

$("#rNext").addEventListener("click", () => {
  const nid = nextUnitId();
  $("#result").hidden = true;
  if (nid) startUnit(nid);
});
$("#rPick").addEventListener("click", () => {
  $("#result").hidden = true;
  stopLoop();
  state.unitId = nextUnitId() || state.unitId;
  renderUnits();
  show("screen-start");
});
$("#rRetry").addEventListener("click", () => {
  $("#result").hidden = true;
  startUnit(state.unitId);
});

renderUnits();
renderChars();
</script>
